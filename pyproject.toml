[project]
name = "pacmanrl"
version = "0.1.0"
description = "An implementation of Pacman RL agent using Reinforcement Learning."
readme = "README.md"
authors = [
    { name = "Krunal Asari", email = "asarikrunal9@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=1.4.0",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
pacmanrl = "pacmanrl:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
